gradleConnectionConnected=<b>Connected</b> to the KoDEx Gradle plugin ({1}): {0} preprocessed source set(s) found.
gradleConnectionConnectedMessage=Files in these source sets use the processors, arguments and plugins of their \
  <code>preprocess</code> configuration, and references (like <code>@include</code>) are only resolved in the source set \
  itself and its <code>contextualSourceSets</code>, just like in the Gradle build. Other files run standalone. \
  Re-sync the Gradle project to pick up changes.
